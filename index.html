<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una misión especial ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:black;
    color:white;
    overflow:hidden;
}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hidden{
    display:none;
}

.logo{
    font-size:clamp(30px,8vw,70px);
    font-weight:900;
    color:#ff2b45;
    letter-spacing:4px;
    animation:glow 2s infinite alternate;
}

.subtitle{
    margin-top:20px;
    color:#ddd;
    font-size:22px;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px red;
    }
    to{
        text-shadow:
            0 0 20px red,
            0 0 40px red,
            0 0 70px red;
    }
}

.countdown{
    font-size:80px;
    margin-top:30px;
}

.card{
    background:rgba(15,15,20,0.95);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:40px;
    width:min(90%,650px);
    box-shadow:0 0 40px rgba(255,0,0,0.2);
}

.question{
    font-size:clamp(28px,6vw,45px);
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:16px 35px;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#yes{
    background:#e6243f;
    color:white;
}

#no{
    background:#333;
    color:white;
}

.heart{
    position:fixed;
    bottom:-20px;
    font-size:30px;
    animation:float 4s linear forwards;
}

@keyframes float{
    to{
        transform:translateY(-110vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="screen" id="intro1">
    <div class="logo">UNA PRODUCCIÓN ESPECIAL</div>
</div>

<div class="screen hidden" id="intro2">
    <div class="logo">MISIÓN IMPORTANTE</div>
    <div class="subtitle">
        Hay algo que necesito preguntarte...
    </div>
</div>

<div class="screen hidden" id="intro3">
    <div class="countdown" id="count">3</div>
</div>

<!-- PREGUNTA -->
<div class="screen hidden" id="main">
    <div class="card">
        <div class="question">
            ¿Quieres salir conmigo el domingo? ❤️
        </div>

        <div class="buttons">
            <button id="yes">SÍ ❤️</button>
            <button id="no">NO</button>
        </div>
    </div>
</div>

<script>

// INTRO

setTimeout(()=>{
    intro1.classList.add("hidden");
    intro2.classList.remove("hidden");
},2500);

setTimeout(()=>{
    intro2.classList.add("hidden");
    intro3.classList.remove("hidden");

    let n=3;

    let interval=setInterval(()=>{
        n--;
        count.textContent=n;

        if(n==0){
            clearInterval(interval);

            setTimeout(()=>{
                intro3.classList.add("hidden");
                main.classList.remove("hidden");
            },700);
        }

    },1000);

},5000);


// BOTÓN SÍ

yes.addEventListener("click",()=>{

    main.innerHTML=`
    <div class="card">
        <h1 style="font-size:50px;">❤️</h1>
        <h1>¡MISIÓN COMPLETADA!</h1>
        <br>
        <h2>Nos vemos el domingo 🫶</h2>
    </div>
    `;

    for(let i=0;i<40;i++){

        setTimeout(()=>{

            let h=document.createElement("div");

            h.className="heart";

            h.innerHTML=["❤️","💖","✨","💕"]
            [Math.floor(Math.random()*4)];

            h.style.left=Math.random()*100+"vw";

            document.body.appendChild(h);

            setTimeout(()=>{
                h.remove();
            },4000);

        },i*80);
    }

});


// BOTÓN NO

let attempts=0;

no.addEventListener("click",()=>{

    attempts++;

    if(attempts<4){

        no.style.transform=
        `translate(
            ${(Math.random()*120)-60}px,
            ${(Math.random()*80)-40}px
        )`;

        no.innerText=[
            "¿Segura? 👀",
            "Piénsalo",
            "Última oportunidad 👀"
        ][attempts-1];

    }else{

        no.innerText="Está bien ❤️";
        no.style.transform="none";

    }

});
</script>

</body>
</html>
